# VeriFact Backend — Render.com Deployment Configuration
# https://render.com/docs/render-yaml-spec

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: verifact-backend
    runtime: python
    region: oregon
    plan: starter          # free tier (upgrade for production)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/ready
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true          # Render auto-generates a secure value

      # Database — use Render-managed PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: verifact-db
          property: connectionString

      # Redis — use Render-managed Redis
      - key: REDIS_URL
        fromService:
          name: verifact-redis
          type: redis
          property: connectionString

      # Frontend origin for CORS
      - key: CORS_ORIGINS
        value: https://verifact.vercel.app

      # AI API Keys — set these manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Model settings
      - key: LAZY_LOAD_MODELS
        value: "true"
      - key: DEVICE
        value: cpu
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  # ── Managed PostgreSQL ─────────────────────────────────────────────────────
  - type: pserv
    name: verifact-db
    runtime: postgres
    plan: starter
    region: oregon
    databaseName: verifact
    databaseUser: verifact

  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: verifact-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
